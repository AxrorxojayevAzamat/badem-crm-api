services:
  postgres:
    image: postgres:16-alpine
    container_name: badem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badem
    ports:
      - '5432:5432'
    volumes:
      - badem-pgdata:/var/lib/postgresql/data

volumes:
  badem-pgdata:
